<title>الأخبار والإعلانات — لوحة الإدارة | نقابة المهندسين السوريين</title>

<style>
/* أنماط الصفحة — بتوكنات الهوية حصراً */
.sheet-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* .adm-table td تمنع الالتفاف: المحدِّد الأقوى كي يلتفّ العنوان والملخّص في خليتهما */
.adm-table td.news-title-cell{max-width:360px;min-width:220px;white-space:normal}
.news-title-cell b{display:block;font-size:14px;line-height:1.55;color:var(--navy-800)}
.news-title-cell small{display:block;margin-block-start:3px;font-size:12px;line-height:1.7;
  color:var(--text-secondary);overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
/* العنوان يفتح معاينة الخبر كما يراه العضو */
.news-open{display:block;padding:0;font:inherit;font-size:14px;font-weight:700;line-height:1.55;
  text-align:start;color:var(--navy-800);text-decoration:underline;text-decoration-color:var(--navy-200);
  text-underline-offset:3px;cursor:pointer}
.news-open:hover{text-decoration-color:var(--gold-600)}
.news-link{display:inline-flex;align-items:center;gap:5px;margin-block-start:5px;
  font-size:12px;font-weight:600;color:var(--navy-700)}
.news-link svg{width:13px;height:13px;flex:none;color:var(--gold-600)}
.news-link span{direction:ltr;unicode-bidi:isolate;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news-thumb{width:64px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.news-img-now{max-width:220px;border-radius:8px;border:1px solid var(--border)}
.news-checks{display:flex;gap:16px;flex-wrap:wrap;margin-block-start:6px}
.news-checks label{display:flex;align-items:center;gap:7px;font-size:13.5px;min-height:32px}
.news-hint{display:block;margin-block-start:6px}

/* معاينة الخبر: البطاقة وصفحة الخبر بشكلهما في التطبيق */
.np-cap{font-size:12.5px;font-weight:700;color:var(--text-secondary)}
.np-card,.np-article{background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow-rest)}
.np-cover{aspect-ratio:21/9;background:var(--navy-50)}
.np-cover img{width:100%;height:100%;object-fit:cover;display:block}
.np-band{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:9px 14px;
  background:var(--navy-50);border-block-end:1px solid var(--border);font-size:11.5px;line-height:1.55}
.np-cat{display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--navy-700)}
.np-cat::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold-400)}
.np-chip{display:inline-flex;align-items:center;min-height:20px;padding-inline:8px;
  border:1px solid var(--gold-100);border-radius:var(--radius-pill);background:var(--surface);
  color:var(--gold-700);font-weight:700}
.np-date{margin-inline-start:auto;color:var(--text-secondary);font-weight:600}
.np-body{padding:14px;display:grid;gap:6px}
.np-body h3{font-size:15px;line-height:1.55;margin:0}
.np-body p{font-size:12.5px;line-height:1.7;color:var(--text-secondary);margin:0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.np-more{font-size:12px;font-weight:700;color:var(--navy-700)}
.np-figure{margin:0;background:var(--navy-25);border-block-end:1px solid var(--border)}
.np-figure img{width:100%;height:auto;max-height:320px;object-fit:contain;display:block}
.np-art{padding:18px 16px}
.np-art h3{font-size:19px;line-height:1.55;margin:0}
.np-text{margin-block-start:10px;font-size:14px;line-height:1.95;color:var(--text-primary);overflow-wrap:anywhere}
.np-text p{margin:0}
.np-text p + p{margin-block-start:10px}
.np-text .np-lead{font-weight:700;color:var(--text-display)}
.np-inlink{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--navy-700);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold-400)}
.np-inlink svg{width:14px;height:14px;flex:none}
.np-linkbox{display:grid;gap:8px;margin-block-start:18px;padding-block-start:14px;border-block-start:1px solid var(--border)}
.np-linkbox .btn{width:100%}
.np-note{font-size:11.5px;color:var(--text-secondary);text-align:center;margin:0}
.np-note span{direction:ltr;unicode-bidi:isolate}

@media (max-width:560px){
  .sheet-pair{grid-template-columns:1fr}
}
/* اللوحي العمودي: القسم والتصنيفات والصورة في المعاينة ولوحة التعديل، والتاريخ
   يلتفّ — كي لا يغطّي عمودُ الإجراءات الملتصق الحالةَ */
@media (min-width:721px) and (max-width:900px){
  .adm-table th.tb-sec,.adm-table td.tb-sec{display:none}
  .adm-table td.news-date{white-space:normal;min-width:84px}
}
/* الهاتف: خانات النموذج بأهداف لمس كاملة */
@media (max-width:720px){
  .news-checks label{min-height:44px}
}
/* معاينة قالب الغلاف داخل اللوحة — يرى المحرّر ما سيراه العضو */
.cov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block-start:8px}
.cov-opt{position:relative}
.cov-opt input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.cov-opt span{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 6px;border:1.5px solid var(--border-strong);border-radius:10px;
  background:var(--navy-800);color:var(--gold-300);
  font-size:11.5px;font-weight:600;text-align:center;
}
.cov-opt span svg{width:26px;height:26px;stroke:var(--gold-400);fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cov-opt input:checked + span{border-color:var(--gold-400);box-shadow:0 0 0 2px rgba(211,165,24,.28)}
.cov-opt input:focus-visible + span{box-shadow:0 0 0 3px rgba(211,165,24,.55)}
</style>
</head>
<body>

<main>
  <section class="section--tight">
    <div class="container">

      <div class="adm-kpis" id="kpis"></div>

      <div class="notice" style="margin-block:22px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>
          <strong>ما يُنشر هنا يظهر فوراً في التطبيق والموقع.</strong>
          «غير منشور» يُخفي الخبر عن الجميع دون حذفه.
        </span>
      </div>

      <div class="adm-bar">
        <div class="adm-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="q" type="search" autocomplete="off"
                 placeholder="بحث بالعنوان أو النص أو القسم">
        </div>
        <span class="spacer"></span>
        <button class="btn btn-primary btn-sm" id="addBtn" data-write>إضافة خبر</button>
      </div>

      <div class="adm-bar" style="margin-block-start:-8px">
        <div class="adm-filters" id="filters" role="group" aria-label="تصفية بالحالة"></div>
      </div>

      <div class="adm-table-card">
        <div class="adm-table-head">
          <h2>سجل الأخبار</h2>
          <span class="spacer"></span>
          <span class="tag" id="totalTag">—</span>
        </div>
        <div class="adm-scroll">
          <table class="adm-table">
            <thead>
              <tr>
                <th class="adm-card-title">العنوان</th>
                <th class="tb-sec">القسم</th>
                <th>التاريخ</th>
                <th class="tb-sec">التصنيفات</th>
                <th class="tb-sec">الصورة</th>
                <th>مثبّت</th>
                <th>الحالة</th>
                <th class="acts">إجراءات</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr><td colspan="8"><div class="adm-state"><p>جارٍ التحميل…</p></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="adm-pager">
          <span>المثبّت يظهر أولاً، ثم الأحدث تاريخاً. وترتيب المتساويين بحقل «الترتيب».</span>
        </div>
      </div>

    </div>
  </section>
</main>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/osea-config.js"></script>
<script src="assets/js/osea-api.js"></script>
<script src="assets/js/admin.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  'use strict';
  var A = window.ADMIN, API = window.OSEA_API;

  /* قوالب الغلاف — نفس المفاتيح المسموحة في قيد جدول news،
     ونفس الرسوم المستعملة في شاشة الأخبار بالتطبيق. */
  var COVERS = [
    { k: 'megaphone', label: 'إعلان',   g: '<path d="m3 11 18-5v12L3 13z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>' },
    { k: 'exam',      label: 'اختبار',  g: '<path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>' },
    { k: 'book',      label: 'مكتبة',   g: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' },
    { k: 'council',   label: 'المجلس',  g: '<path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/>' },
    { k: 'office',    label: 'الفعاليات', g: '<path d="M3 21h18"/><path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M15 9h3a1 1 0 0 1 1 1v11"/><path d="M9 8h2M9 12h2M9 16h2"/>' },
    { k: 'fund',      label: 'الصندوق', g: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5a3.5 3 0 1 0 0 5"/><path d="M12 6v12"/>' },
    { k: 'soon',      label: 'قريباً',  g: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>' },
    { k: 'shield',    label: 'حماية',   g: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>' },
    { k: 'calendar',  label: 'موعد',    g: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>' }
  ];
  var COVER_OF = {};
  COVERS.forEach(function (c) { COVER_OF[c.k] = c; });

  /* التصنيفات المتاحة — تطابق مصفيات شاشة الأخبار في التطبيق.
     المفاتيح ثابتة في القاعدة والتسميات للعرض وحده */
  var CATS = [
    { k: 'platform', label: 'المنصة' },
    { k: 'council',  label: 'القرارات' },
    { k: 'offices',  label: 'الفعاليات' }
  ];
  /* قيم القسم القديمة تُعرض وتُحفظ بالتسمية الجديدة (ترحيلة ٠٣٩ تحوّل المخزَّن) */
  var SECTION_LABEL = { 'قرارات المجلس': 'القرارات', 'المكاتب': 'الفعاليات', 'المكاتب الهندسية': 'الفعاليات' };
  function secLabel(s) {
    s = String(s == null ? '' : s).trim();
    return SECTION_LABEL[s] || s;
  }

  /* رابط الخبر: ويبٌ فقط بلا مسافة ولا «\» — قيد ترحيلة ٠٣٩ يطابقه */
  var LINK_RE = /^https?:\/\/[^\s\\]+$/i;
  function webUrl(u) {
    var s = String(u == null ? '' : u).trim();
    return (s.length <= 500 && LINK_RE.test(s)) ? s : '';
  }
  function hostOf(h) {
    var m = /^https?:\/\/([^\/\\?#]*)/i.exec(String(h));
    if (!m) { return ''; }
    return m[1].slice(m[1].lastIndexOf('@') + 1).toLowerCase();
  }
  var ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>' +
    '<path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>';
  /* أيقونة الرابط الخارجي — نسخة زر صفحة الخبر في التطبيق (app/news.html) */
  var ICON_EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/>' +
    '<path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';

  function dbErr(e) {
    var m = (e && (e.message || e.hint || e.details)) || '';
    if ((e && (e.code === 'PGRST204' || e.code === '42703')) ||
        (/link_url|link_label/i.test(m) && /column|schema cache|does not exist/i.test(m))) {
      return 'حقلا رابط الخبر غير موجودين في القاعدة بعد — ترحيلة 039 لم تُطبَّق. '
           + 'نفّذوها ثم أعيدوا المحاولة.';
    }
    return A.errText(e);
  }

  var state = { status: 'all', search: '' };
  var items = [];
  var $ = function (id) { return document.getElementById(id); };
  var tbody, filtersEl;

  A.boot({
    page: 'news',
    title: 'الأخبار والإعلانات',
    lead: 'سجل ما تعلنه النقابة على التطبيق والموقع — إنشاء الخبر ونشره وسحبه '
        + 'وتثبيته، وكل تغيير يظهر للأعضاء فور حفظه دون إصدار جديد للتطبيق.',
    crumb: 'الأخبار'
  }).then(function (st) {
    if (!st) { return; }
    tbody = $('rows'); filtersEl = $('filters');
    wire();
    load();
  });

  function wire() {
    $('q').addEventListener('input', A.debounce(function (e) {
      state.search = A.norm(e.target.value);
      render();
    }, 160));
    $('addBtn').addEventListener('click', function () { openEdit(null); });
    filtersEl.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button[data-status]') : null;
      if (!b) { return; }
      state.status = b.getAttribute('data-status');
      render();
    });
  }

  function load() {
    API.news.all().then(function (rows) {
      items = rows || [];
      render();
    }).catch(function (err) {
      tbody.innerHTML = '<tr><td colspan="8">' + A.errorState(A.errText(err)) + '</td></tr>';
    });
  }

  function visible() {
    return items.filter(function (r) {
      if (state.status === 'live' && !r.active) { return false; }
      if (state.status === 'draft' && r.active) { return false; }
      if (state.status === 'pinned' && !r.pinned) { return false; }
      if (!state.search) { return true; }
      var hay = A.norm([r.title, r.summary, r.body, secLabel(r.section), r.chip, r.link_url].join(' '));
      return hay.indexOf(state.search) > -1;
    });
  }

  function render() {
    var live = items.filter(function (r) { return r.active; }).length;
    var pinned = items.filter(function (r) { return r.pinned; }).length;
    $('kpis').innerHTML =
      kpi('إجمالي الأخبار', items.length, 'كل ما في السجل') +
      kpi('منشور', live, 'ظاهر للأعضاء الآن') +
      kpi('غير منشور', items.length - live, 'محفوظ ومخفيّ') +
      kpi('مثبّت', pinned, 'يتصدّر القائمة');

    filtersEl.innerHTML = [
      ['all', 'الكل', items.length],
      ['live', 'منشور', live],
      ['draft', 'غير منشور', items.length - live],
      ['pinned', 'مثبّت', pinned]
    ].map(function (f) {
      var on = state.status === f[0];
      return '<button type="button" class="adm-chip" data-status="' + f[0] +
        '" aria-pressed="' + (on ? 'true' : 'false') + '">' + A.esc(f[1]) +
        '<span class="n">' + A.toAr(f[2]) + '</span></button>';
    }).join('');

    var rows = visible();
    $('totalTag').textContent = A.toAr(rows.length) + ' من ' + A.toAr(items.length);

    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="8">' +
        A.emptyState(items.length ? 'لا نتائج مطابقة.' : 'لا أخبار بعد — ابدأ بإضافة خبر.') +
        '</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(function (r) {
      var link = webUrl(r.link_url);
      return '<tr>' +
        '<td class="news-title-cell">' +
          '<button type="button" class="news-open" data-view="' + A.esc(r.id) + '" title="معاينة الخبر">' +
            A.esc(r.title) + '</button>' +
          '<small>' + A.esc(r.summary) + '</small>' +
          (link ? '<span class="news-link" title="' + A.esc(link) + '">' + ICON_LINK +
            '<span>' + A.esc(hostOf(link)) + '</span></span>' : '') +
        '</td>' +
        '<td class="tb-sec">' + A.esc(secLabel(r.section) || '—') + '</td>' +
        '<td class="news-date">' + A.esc(r.date_ar) + '</td>' +
        '<td class="tb-sec">' + ((r.cats || []).map(function (c) {
            var f = CATS.filter(function (x) { return x.k === c; })[0];
            return '<span class="tag">' + A.esc(f ? f.label : c) + '</span>';
          }).join(' ') || '—') + '</td>' +
        '<td class="tb-sec">' + (webUrl(r.image_url)
            ? '<img class="news-thumb" src="' + A.esc(webUrl(r.image_url)) + '" alt="">'
            : '<span class="muted">بلا صورة</span>') + '</td>' +
        '<td>' + (r.pinned ? '<span class="tag tag--gold">مثبّت</span>' : '—') + '</td>' +
        '<td>' + (r.active
            ? '<span class="tag tag--success">منشور</span>'
            : '<span class="tag">غير منشور</span>') + '</td>' +
        '<td class="acts">' +
          '<button class="btn btn-outline btn-sm" data-edit="' + A.esc(r.id) + '" data-write>تعديل</button>' +
          '<button class="btn btn-outline btn-sm" data-toggle="' + A.esc(r.id) + '" data-write>' +
            (r.active ? 'سحب' : 'نشر') + '</button>' +
          '<button class="btn btn-outline btn-sm" data-del="' + A.esc(r.id) + '" data-write>حذف</button>' +
        '</td>' +
      '</tr>';
    }).join('');

    tbody.querySelectorAll('[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { openPreview(byId(b.getAttribute('data-view'))); });
    });
    tbody.querySelectorAll('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openEdit(byId(b.getAttribute('data-edit'))); });
    });
    tbody.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.addEventListener('click', function () { togglePublish(byId(b.getAttribute('data-toggle'))); });
    });
    tbody.querySelectorAll('[data-del]').forEach(function (b) {
      b.addEventListener('click', function () { askDelete(byId(b.getAttribute('data-del'))); });
    });
  }

  function byId(id) {
    return items.filter(function (r) { return String(r.id) === String(id); })[0];
  }

  function kpi(label, n, hint) {
    return '<div class="adm-kpi">' +
      '<span class="adm-kpi-label">' + A.esc(label) + '</span>' +
      '<span class="adm-kpi-num">' + A.toAr(n) + '</span>' +
      '<span class="adm-kpi-hint">' + A.esc(hint) + '</span></div>';
  }

  /* ---------- اللوحة الجانبية: إنشاء وتعديل ---------- */

  function coverPicker(sel) {
    return '<div class="cov-grid">' + COVERS.map(function (c) {
      return '<label class="cov-opt">' +
        '<input type="radio" name="f-icon" value="' + c.k + '"' +
          (c.k === sel ? ' checked' : '') + '>' +
        '<span><svg viewBox="0 0 24 24">' + c.g + '</svg>' + c.label + '</span>' +
      '</label>';
    }).join('') + '</div>';
  }

  function fieldsHTML(r) {
    r = r || {};
    var cats = r.cats || [];
    return '' +
      '<label class="field"><span>العنوان</span>' +
        '<input class="input" id="f-title" maxlength="160" value="' + A.esc(r.title || '') + '"></label>' +
      '<label class="field"><span>الملخّص — السطر الذي يقرؤه العضو في البطاقة</span>' +
        '<textarea class="input" id="f-summary" rows="3" maxlength="400">' + A.esc(r.summary || '') + '</textarea></label>' +
      '<label class="field"><span>نص الخبر (اختياري)</span>' +
        '<textarea class="input" id="f-body" rows="5">' + A.esc(r.body || '') + '</textarea></label>' +
      '<label class="field"><span>رابط الخبر (اختياري)</span>' +
        '<input class="input" id="f-link" type="url" inputmode="url" dir="ltr" maxlength="500" ' +
          'placeholder="https://" autocomplete="off" value="' + A.esc(r.link_url || '') + '"></label>' +
      '<label class="field"><span>نص زر الرابط (اختياري)</span>' +
        '<input class="input" id="f-linklabel" maxlength="60" placeholder="اضغط هنا لفتح الرابط" value="' +
          A.esc(r.link_label || '') + '"></label>' +
      '<div class="sheet-pair">' +
        '<label class="field"><span>القسم — يظهر بجانب التاريخ</span>' +
          '<input class="input" id="f-section" list="f-section-opts" value="' +
            A.esc(secLabel(r.section) || 'المنصة') + '">' +
          '<datalist id="f-section-opts">' + CATS.map(function (c) {
            return '<option value="' + A.esc(c.label) + '">';
          }).join('') + '</datalist></label>' +
        '<label class="field"><span>وسم الخبر (اختياري)</span>' +
          '<input class="input" id="f-chip" value="' + A.esc(r.chip || '') + '"></label>' +
      '</div>' +
      '<div class="sheet-pair">' +
        '<label class="field"><span>تاريخ النشر</span>' +
          '<input class="input" id="f-date" type="date" value="' +
            A.esc(r.published_at || new Date().toISOString().slice(0, 10)) + '"></label>' +
        '<label class="field"><span>الترتيب</span>' +
          '<input class="input" id="f-sort" type="number" min="0" value="' + (r.sort || 0) + '"></label>' +
      '</div>' +
      '<label class="field"><span>نصّ بديل للتاريخ (اختياري) — لخبر بلا موعد معلن</span>' +
        '<input class="input" id="f-datelabel" placeholder="مثال: لم يُعلن الموعد" value="' +
          A.esc(r.date_label || '') + '"></label>' +
      '<div class="field"><span>التصنيفات — تحدّد المصفاة التي يظهر تحتها</span>' +
        '<div class="news-checks">' +
        CATS.map(function (c) {
          return '<label>' +
            '<input type="checkbox" class="f-cat" value="' + A.esc(c.k) + '"' +
              (cats.indexOf(c.k) > -1 ? ' checked' : '') + '> ' + A.esc(c.label) + '</label>';
        }).join('') + '</div></div>' +
      '<div class="field"><span>صورة الخبر (اختيارية)</span>' +
        '<input type="file" class="input" id="f-image" accept="image/jpeg,image/png,image/webp">' +
        '<span class="hint news-hint">JPG أو PNG أو WebP حتى 3 م.ب</span>' +
        '<div id="f-img-now" style="margin-block-start:8px">' +
          (webUrl(r.image_url)
            ? '<img class="news-img-now" src="' + A.esc(webUrl(r.image_url)) + '" alt="">' +
              '<div class="news-checks"><label>' +
              '<input type="checkbox" id="f-img-del"> إزالة الصورة</label></div>'
            : '<span class="hint">لا صورة لهذا الخبر.</span>') +
        '</div></div>' +
      '<div class="news-checks">' +
        '<label><input type="checkbox" id="f-active"' + (r.active === false ? '' : ' checked') + '> منشور</label>' +
        '<label><input type="checkbox" id="f-pinned"' + (r.pinned ? ' checked' : '') + '> مثبّت في الأعلى</label>' +
      '</div>';
  }

  function readFields(host) {
    var g = function (id) { var el = host.querySelector('#' + id); return el ? el.value.trim() : ''; };
    var chk = function (id) { var el = host.querySelector('#' + id); return !!(el && el.checked); };
    var cats = Array.prototype.slice.call(host.querySelectorAll('.f-cat:checked'))
      .map(function (c) { return c.value; });
    var icon = host.querySelector('input[name="f-icon"]:checked');
    return {
      title: g('f-title'), summary: g('f-summary'), body: g('f-body') || null,
      section: secLabel(g('f-section')) || 'المنصة', chip: g('f-chip') || null,
      published_at: g('f-date'), date_label: g('f-datelabel') || null,
      sort: parseInt(g('f-sort'), 10) || 0, cats: cats,
      icon: icon ? icon.value : 'megaphone',
      link_url: g('f-link') || null, link_label: g('f-linklabel') || null,
      active: chk('f-active'), pinned: chk('f-pinned')
    };
  }

  function openEdit(r) {
    A.sheet({
      title: r ? 'تعديل الخبر' : 'إضافة خبر',
      okLabel: r ? 'حفظ التعديلات' : 'إضافة الخبر',
      body: fieldsHTML(r),
      onOk: function (host) {
        var f = readFields(host);
        var linkEl = host.querySelector('#f-link');
        if (linkEl) { linkEl.removeAttribute('aria-invalid'); }
        if (!f.title || f.title.length < 3) { return Promise.reject(new Error('العنوان مطلوب.')); }
        if (!f.summary || f.summary.length < 3) { return Promise.reject(new Error('الملخّص مطلوب.')); }
        if (!f.published_at) { return Promise.reject(new Error('تاريخ النشر مطلوب.')); }
        if (f.link_url && !webUrl(f.link_url)) {
          if (linkEl) { linkEl.setAttribute('aria-invalid', 'true'); linkEl.focus(); }
          return Promise.reject(new Error('رابط الخبر يبدأ بـ https:// أو http:// ولا يحتوي مسافات.'));
        }
        if (f.link_label && !f.link_url) {
          return Promise.reject(new Error('نص زر الرابط يحتاج رابطاً — أدخل رابط الخبر أو احذف النص.'));
        }
        if (f.link_label && f.link_label.length > 60) {
          return Promise.reject(new Error('نص زر الرابط 60 حرفاً على الأكثر.'));
        }
        if (r) {
          f.id = r.id;
          /* قالب الغلاف التاريخي لا يُعرض في النموذج فيبقى كما هو */
          if (!host.querySelector('input[name="f-icon"]')) { f.icon = r.icon || f.icon; }
        }

        /* الصورة: ملف جديد يُرفع للسلة العامة، وخانة الإزالة تحذفها من الخبر */
        var fileEl = host.querySelector('#f-image');
        var delEl = host.querySelector('#f-img-del');
        var file = fileEl && fileEl.files && fileEl.files[0];
        var prep;
        if (file) {
          if (file.size > 3 * 1024 * 1024) {
            return Promise.reject(new Error('الصورة أكبر من 3 م.ب — صغّرها ثم أعد الرفع.'));
          }
          prep = API.news.uploadImage(file).then(function (url) { f.image_url = url; });
        } else if (delEl && delEl.checked) {
          f.image_url = null;
          prep = Promise.resolve();
        } else {
          f.image_url = r ? (r.image_url || null) : null;
          prep = Promise.resolve();
        }

        return prep.then(function () { return API.news.save(f); }).then(function () {
          A.toast(r ? 'حُفظت تعديلات «' + f.title + '».' : 'أُضيف الخبر «' + f.title + '».', 'ok');
          load();
        }).catch(function (err) { throw new Error(dbErr(err)); });
      }
    });
  }

  function togglePublish(r) {
    if (!r) { return; }
    var next = !r.active;
    /* الحمولة كاملة: الحقل الغائب يُحفظ فارغاً، فالصورة والرابط يُمرَّران كما هما */
    API.news.save({
      id: r.id, title: r.title, summary: r.summary, body: r.body,
      chip: r.chip, section: r.section, cats: r.cats, icon: r.icon,
      published_at: r.published_at, date_label: r.date_label,
      image_url: r.image_url || null,
      link_url: r.link_url || null, link_label: r.link_label || null,
      pinned: r.pinned, sort: r.sort, active: next
    }).then(function () {
      A.toast(next ? 'نُشر «' + r.title + '».' : 'سُحب «' + r.title + '» من العرض.', 'ok');
      load();
    }).catch(function (err) { A.toast(dbErr(err), 'bad'); });
  }

  /* ---------- المعاينة: البطاقة وصفحة الخبر كما يراهما العضو ---------- */
  /* رابط داخل النص يظهر للعضو «اضغط هنا»، ويُحذف من ملخّص البطاقة */
  var TEXT_URL_RE = /(?:https?:\/\/|www\.)[^\s<>"'\\]+/gi;
  var URL_TAIL_RE = /[.,،؛:!?؟)\]}»"'’”]+$/;
  function textHtml(s) {
    var out = '', last = 0, m;
    TEXT_URL_RE.lastIndex = 0;
    while ((m = TEXT_URL_RE.exec(s))) {
      var raw = m[0], tail = (URL_TAIL_RE.exec(raw) || [''])[0];
      raw = raw.slice(0, raw.length - tail.length);
      var url = webUrl(/^www\./i.test(raw) ? 'https://' + raw : raw);
      out += A.esc(s.slice(last, m.index));
      out += url
        ? '<a class="np-inlink" href="' + A.esc(url) + '" target="_blank" rel="noopener noreferrer">' +
            'اضغط هنا' + ICON_EXT + '</a>' + A.esc(tail)
        : A.esc(m[0]);
      last = m.index + m[0].length;
    }
    return (out + A.esc(s.slice(last))).replace(/\n/g, '<br>');
  }
  function brief(s) {
    return String(s == null ? '' : s).replace(TEXT_URL_RE, '')
      .replace(/[ \t]{2,}/g, ' ').replace(/\s+([.,،؛:])(?=\s|$)/g, '$1').replace(/[\s:،؛–—-]+$/, '').trim();
  }
  function paras(s, cls) {
    var t = String(s == null ? '' : s).replace(/\r\n?/g, '\n').trim();
    if (!t) { return ''; }
    return t.split(/\n[ \t]*\n+/).map(function (p) {
      return '<p' + (cls ? ' class="' + cls + '"' : '') + '>' + textHtml(p.trim()) + '</p>';
    }).join('');
  }

  function previewHTML(r) {
    var img = webUrl(r.image_url), link = webUrl(r.link_url);
    var label = String(r.link_label == null ? '' : r.link_label).trim() || 'اضغط هنا لفتح الرابط';
    var band = '<div class="np-band"><span class="np-cat">' + A.esc(secLabel(r.section) || 'المنصة') + '</span>' +
      (r.chip ? '<span class="np-chip">' + A.esc(r.chip) + '</span>' : '') +
      '<span class="np-date">' + A.esc(r.date_ar) + '</span></div>';
    return (r.active ? '' :
        '<div class="notice"><span>هذا الخبر غير منشور — لا يراه الأعضاء حتى يُنشر.</span></div>') +
      '<span class="np-cap">في قائمة الأخبار</span>' +
      '<div class="np-card">' +
        (img ? '<div class="np-cover"><img src="' + A.esc(img) + '" alt=""></div>' : '') +
        band +
        '<div class="np-body"><h3>' + A.esc(r.title) + '</h3><p>' + A.esc(brief(r.summary)) + '</p>' +
          '<span class="np-more">اقرأ الخبر</span></div>' +
      '</div>' +
      '<span class="np-cap">صفحة الخبر</span>' +
      '<div class="np-article">' +
        band +
        (img ? '<figure class="np-figure"><img src="' + A.esc(img) + '" alt=""></figure>' : '') +
        '<div class="np-art"><h3>' + A.esc(r.title) + '</h3>' +
          '<div class="np-text">' + paras(r.summary, 'np-lead') + paras(r.body) + '</div>' +
          (link
            ? '<div class="np-linkbox">' +
                '<a class="btn btn-primary" href="' + A.esc(link) + '" target="_blank" rel="noopener noreferrer">' +
                  ICON_EXT + A.esc(label) + '</a>' +
                '<p class="np-note">يُفتح الرابط في المتصفح</p>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>';
  }

  function openPreview(r) {
    if (!r) { return; }
    A.sheet({ title: 'معاينة الخبر', body: previewHTML(r), hideOk: true });
  }

  function askDelete(r) {
    if (!r) { return; }
    A.confirm({
      title: 'حذف الخبر',
      text: 'سيُحذف «' + r.title + '» نهائياً ولا يمكن التراجع. '
          + 'وإن كان القصد إخفاءه مؤقتاً فاستعمل «سحب» بدل الحذف — يبقى السجل ويعود بضغطة.',
      okLabel: 'حذف نهائي'
    }).then(function (ok) {
      if (!ok) { return; }
      API.news.remove(r.id).then(function () {
        A.toast('حُذف «' + r.title + '».', 'ok');
        load();
      }).catch(function (err) { A.toast(A.errText(err), 'bad'); });
    });
  }
})();
</script>
</body>
</html>
