/* نتيجة فحص الرقم النقابي: الصيغة ثم الحسابات التي تحمل الرقم */
.sc-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.sc-head .adm-mono{font-size:15px;font-weight:700;color:var(--navy-800)}
.sc-out{display:grid;gap:12px}
.sc-list{display:grid;gap:8px}
.sc-item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:11px 13px;
  background:var(--surface);border:var(--adm-hair);border-radius:var(--adm-tool)}
.sc-main{flex:1 1 190px;min-width:0}
.sc-main a{color:var(--navy-700);font-weight:700;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--navy-200)}
.sc-main a:hover{text-decoration-color:var(--gold-600)}
.sc-tags{display:flex;flex-wrap:wrap;gap:6px}
/* شارة الحالة تحت الرقم أو الاسم لا تنكسر سطرين حين يضيق العمود */
.adm-table .adm-sub .tag{white-space:nowrap}
/* البريد يلتفّ بعد @ وحدها (wbr) فيتّسع عمود الإجراءات لأزرار الصف في سطر واحد */
.adm-table td.us-contact{white-space:normal;min-width:120px}
#rows td.wrap{min-width:180px}
/* سبب الرفض سطران في الجدول والنص كاملاً في التلميح وملف العضو؛ وفي البطاقة كاملاً */
@media (min-width:721px){
  .us-reason{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
}
/* على الهاتف: الهوية وتاريخ التسجيل في ملف العضو، والبطاقة للقرار وحده */
@media (max-width:720px){
  .adm-table:not(.adm-table--grid) > tbody > tr > td.us-minor{display:none}
}

<body>

<main>
  <section class="section--tight">
    <div class="container">

      <!-- شريط الأدوات: بحث خادمي + تصفية + فرز + تصدير -->
      <div class="adm-bar">
        <div class="adm-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="q" type="search" autocomplete="off"
                 placeholder="بحث بمعرّف الحساب أو الاسم أو الرقم النقابي أو الهوية أو الموبايل أو البريد">
        </div>
        <select class="input" id="branch" style="flex:0 1 190px" aria-label="تصفية بالفرع">
          <option value="all">كل الفروع</option>
        </select>
        <select class="input" id="sort" style="flex:0 1 190px" aria-label="ترتيب">
          <option value="created_desc">الأحدث تسجيلاً</option>
          <option value="created_asc">الأقدم تسجيلاً</option>
          <option value="name_asc">الاسم (أ–ي)</option>
          <option value="name_desc">الاسم (ي–أ)</option>
          <option value="branch_asc">الفرع</option>
          <option value="status_asc">الحالة</option>
        </select>
        <span class="spacer"></span>
        <button class="btn btn-outline btn-sm" id="syndCheckBtn" type="button">التحقق من رقم نقابي</button>
        <button class="btn btn-outline btn-sm" id="exportBtn">تصدير Excel</button>
      </div>

      <div class="adm-bar" style="margin-block-start:-8px">
        <div class="adm-filters" id="filters" role="group" aria-label="تصفية بالحالة"></div>
        <!-- طابور التوثيق (ترحيلة ٠٢٩): مجموعة ثانية مستقلة عن شرائح الحالة
             عمداً — «موافَق عليه» حالةُ انتساب و«بانتظار التوثيق» حالةُ رقمٍ
             أو مرتبة، فجمعهما في مجموعة واحدة يوحي بأنها قيمٌ لحقلٍ واحد
             يُلغي بعضها بعضاً وهي في الحقيقة تتراكب. تبقى مخفيةً حتى يثبت أن
             القاعدة تعرف p_verify: قاعدةٌ لم تصلها ٠٢٩ لا تُعرض عليها شرائح
             لا تعمل. -->
        <div class="adm-filters" id="vfilters" role="group"
             aria-label="تصفية بطابور التوثيق" hidden></div>
      </div>

      <!-- شريط العمليات الجماعية -->
      <div class="adm-bar" id="bulkBar" hidden style="border-color:var(--gold-400);background:var(--cream-50)">
        <strong id="bulkCount" style="font-size:14px"></strong>
        <span class="spacer"></span>
        <button class="btn btn-primary btn-sm" data-write id="bulkApprove">الموافقة على المحدَّد</button>
        <button class="btn btn-outline btn-sm" data-write id="bulkReject">رفض المحدَّد</button>
        <button class="btn btn-outline btn-sm" id="bulkClear">إلغاء التحديد</button>
      </div>

      <div class="adm-table-card">
        <div class="adm-table-head">
          <h2 id="tableTitle">الحسابات المسجّلة</h2>
          <span class="spacer"></span>
          <span class="tag" id="totalTag">—</span>
        </div>
        <div class="adm-scroll">
          <table class="adm-table">
            <thead>
              <tr>
                <th style="width:40px"><input class="adm-check" type="checkbox" id="selAll" aria-label="تحديد الكل" data-write></th>
                <!-- معرّف الحساب أول الأعمدة: التفعيل يجري به (طلب النقابة ٧ ت٢)،
                     وهو الرقم نفسه الظاهر للعضو في شاشة «حسابي» بالتطبيق -->
                <th>معرّف الحساب</th>
                <th>الاسم</th>
                <th>الرقم النقابي</th>
                <th>رقم الهوية</th>
                <th>الفرع</th>
                <th>الاختصاص</th>
                <th>وسيلة التواصل</th>
                <th>تاريخ التسجيل</th>
                <th>الحالة</th>
                <th class="acts">إجراءات</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr><td colspan="11"><div class="adm-state"><p>جارٍ التحميل…</p></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="adm-pager" id="pager"></div>
      </div>

    </div>
  </section>

<script>
(function () {
  'use strict';
  var A = window.ADMIN, API = window.OSEA_API;

  var STATUS = {
    pending:  { label: 'بانتظار الموافقة', cls: 'tag--gold' },
    approved: { label: 'موافَق عليه',       cls: 'tag--success' },
    rejected: { label: 'مرفوض',             cls: 'tag--error' }
  };

  /* شريحتا طابور التوثيق (٠٢٩) — قيمتا p_verify اللتان تعرفهما الدالة.
     التسميتان تقولان «بانتظار» صراحةً كي لا تُقرأ الشريحة تصفيةً على
     «من له رقم نقابي» بدل «من ينتظر توثيقه». */
  var VERIFY = [['synd', 'رقم نقابي بانتظار التوثيق', 'pending_synd'],
                ['grade', 'مرتبة بانتظار البتّ',      'pending_grade']];

  /* الحالة الابتدائية تقبل ?status= — النظرة العامة تربط ببطاقة «بانتظار
     الموافقة» مباشرةً، فلا يصح أن تفتح الصفحة على «الكل».
     و?verify= بالمنطق نفسه: طابور التوثيق يجب أن يكون قابلاً للربط من أي
     شاشة أو رسالة داخلية، لا أن يُبلَغ بضغطتين فقط. */
  var qs = new URLSearchParams(window.location.search);
  var q0 = qs.get('status');
  var v0 = qs.get('verify');
  var state = { search: qs.get('q') || '',
                status: ['pending', 'approved', 'rejected'].indexOf(q0) >= 0 ? q0 : 'all',
                branch: 'all',
                /* قيمتا الشريحتين وحدهما — الدالة تقبل 'any' أيضاً لكن لا
                   شريحة لها، وحالةٌ مصفّاة بلا شريحة مضغوطة تكذب على القارئ */
                verify: ['synd', 'grade'].indexOf(v0) >= 0 ? v0 : '',
                sort: 'created_desc', limit: 50, offset: 0, total: 0 };
  var rows = [];
  var picked = Object.create(null);

  /* هل تقبل الدالة في القاعدة وسيط p_verify؟ يُحسم عند أول نداء ولا يُسأل
     بعده (تسامح الترحيلات: ٠٢٩ قد لا تُطبَّق أياماً بعد نشر الواجهة). */
  var verifyOk = true;

  var $ = function (id) { return document.getElementById(id); };
  var tbody, pagerEl, filtersEl, vfiltersEl, bulkBar, bulkCount;

  A.boot({
    page: 'users',
    title: 'الحسابات',
    lead: 'كل طلبات الانتساب المسجّلة على المنصة — بحث وتصفية وفرز على الخادم، '
        + 'وموافقة ورفض وتعديل، وملف تفصيلي لكل عضو.',
    crumb: 'الحسابات'
  }).then(function (st) {
    if (!st) return;
    tbody = $('rows'); pagerEl = $('pager'); filtersEl = $('filters');
    vfiltersEl = $('vfilters');
    bulkBar = $('bulkBar'); bulkCount = $('bulkCount');
    if (state.search) { $('q').value = state.search; }
    /* الإرشاد الكامل لا يتّسع لحقل الهاتف فيُقصّ وسط الكلمة */
    if (window.matchMedia && window.matchMedia('(max-width: 720px)').matches) {
      $('q').placeholder = 'بحث بمعرّف الحساب أو الاسم أو الأرقام';
    }
    wire();
    load();
  });

  function wire() {
    $('q').addEventListener('input', A.debounce(function () {
      state.search = $('q').value.trim(); state.offset = 0; load();
    }, 300));
    $('branch').addEventListener('change', function () {
      state.branch = this.value; state.offset = 0; load();
    });
    $('sort').addEventListener('change', function () {
      state.sort = this.value; state.offset = 0; load();
    });
    $('exportBtn').addEventListener('click', exportAll);
    $('syndCheckBtn').addEventListener('click', openSyndCheck);
    $('selAll').addEventListener('change', function () {
      var on = this.checked;
      rows.forEach(function (r) { if (on) picked[r.id] = r; else delete picked[r.id]; });
      paintRows(); paintBulk();
    });
    $('bulkClear').addEventListener('click', function () {
      picked = Object.create(null); paintRows(); paintBulk();
    });
    $('bulkApprove').addEventListener('click', function () { bulk('approved'); });
    $('bulkReject').addEventListener('click', function () { bulk('rejected'); });
    tbody.addEventListener('click', onRowClick);
    tbody.addEventListener('change', onRowChange);
  }

  /* ---------------------------------------------------------------- التحميل */

  /* هل يقول الخطأ «الدالة لا تعرف p_verify»؟ PostgREST يختار الدالة بأسماء
     المفاتيح المرسَلة، فمفتاحٌ خارج التوقيع يعني عنده «لا دالة بهذا الاسم»
     (PGRST202) لا «وسيط يُتجاهَل» — وهذا بعينه ما يحدث قبل تطبيق ٠٢٩. */
  function isVerifyUnsupported(e) {
    var m = (e && (e.message || e.hint || e.details)) || '';
    return !!(e && (e.code === 'PGRST202' || e.code === '42883')) ||
           /p_verify|schema cache/i.test(m);
  }

  /* نداء ٠٠٨ كما كان — بلا p_verify — لقاعدة لم تصلها ٠٢٩ بعد.
     ولِمَ نداء مباشر لا API.admin.accounts؟ لأن الأخيرة تُرسل p_verify في
     كل نداء ولو فارغاً، فلا سبيل إلى حذف المفتاح من طريقها. وبلا هذا
     المسار لا تتعطّل ميزةُ الطابور وحدها بل شاشةُ الحسابات كلها بين نشر
     الواجهة وتطبيق الترحيلة. الترويسة على نمط content-url في osea-api.js:
     apikey + رمز الجلسة — والرمز لازم لأن is_staff() تُقيَّم على المستخدم
     الداخل لا على anon. */
  function legacyAccounts(o) {
    var cfg = window.OSEA_CONFIG || {};
    if (!cfg.SUPABASE_URL || typeof fetch !== 'function') {
      return Promise.reject(new Error('تعذّر الاتصال بقاعدة النقابة'));
    }
    return API.session().then(function (s) {
      return fetch(cfg.SUPABASE_URL + '/rest/v1/rpc/admin_list_accounts', {
        method: 'POST',
        headers: {
          apikey: cfg.SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + ((s && s.access_token) || cfg.SUPABASE_ANON_KEY),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          p_search: o.search || null, p_status: o.status || null,
          p_branch: o.branch || null, p_sort: o.sort || 'created_desc',
          p_limit: o.limit || 50, p_offset: o.offset || 0
        })
      });
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) {
          throw new Error((j && (j.message || j.hint)) ||
                          ('تعذّر جلب الحسابات (' + r.status + ')'));
        }
        return j;
      });
    });
  }

  /* المدخل الوحيد إلى القائمة — الجدول والتصدير معاً، كي لا يبقى أحدهما
     على المسار الجديد والآخر على القديم. */
  function fetchAccounts(o) {
    if (!verifyOk) { return legacyAccounts(o); }
    return API.admin.accounts(o).catch(function (e) {
      if (!isVerifyUnsupported(e)) { throw e; }
      /* الترحيلة لم تصل القاعدة: نُسقط التصفية ونُخفي شريحتيها ونُكمل
         بالسلوك القديم — لا شاشة خطأ على ميزةٍ إضافية. */
      verifyOk = false;
      state.verify = '';
      return legacyAccounts(o);
    });
  }

  function load() {
    tbody.innerHTML = '<tr><td colspan="11"><div class="adm-state"><p>جارٍ التحميل…</p></div></td></tr>';
    fetchAccounts(state).then(function (d) {
      rows = d.rows || [];
      state.total = d.total | 0;
      paintFilters(d.counts || {});
      paintVerify(d.counts || {});
      paintBranches(d.branches || []);
      $('totalTag').textContent = A.toAr(state.total) + ' حساب';
      paintRows();
      A.pager(pagerEl, state, function (off) {
        state.offset = off; load(); window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }).catch(function (e) {
      tbody.innerHTML = '<tr><td colspan="11">' + A.errorState(A.errText(e), 'retry') + '</td></tr>';
      var r = $('retry'); if (r) r.addEventListener('click', load);
    });
  }

  function paintFilters(c) {
    var defs = [['all', 'الكل'], ['pending', 'بانتظار الموافقة'],
                ['approved', 'موافَق عليها'], ['rejected', 'مرفوضة']];
    filtersEl.innerHTML = defs.map(function (d) {
      return '<button class="adm-chip" data-f="' + d[0] + '" aria-pressed="' +
        (state.status === d[0]) + '">' + A.esc(d[1]) +
        '<span class="n">' + A.toAr(c[d[0]] || 0) + '</span></button>';
    }).join('');
    filtersEl.querySelectorAll('[data-f]').forEach(function (b) {
      b.addEventListener('click', function () {
        state.status = b.getAttribute('data-f'); state.offset = 0; load();
      });
    });
  }

  /* شريحتا طابور التوثيق (٠٢٩) — على شاكلة paintFilters أعلاه، وتفترقان
     عنها في ثلاثة أشياء مقصودة:
       • العدّ يأتي من مفتاح مستقل عن قيمة الشريحة (counts.pending_synd لا
         counts.synd) لأن مجاميع الطابور غير مجاميع حالة الحساب.
       • لا شريحة «الكل» هنا: المحايد هو ألّا تُصفّى، فالضغط على شريحة
         مفعّلة يُلغيها — ولولا ذلك لَما أمكن الخروج من الطابور إلا بتحديث
         الصفحة، لأن الشريحتين تتراكبان مع شرائح الحالة ولا تُلغيانها.
       • المجموعة كلها تختفي إن لم تعرف القاعدة p_verify (تسامح ٠٢٩):
         حارسان لا واحد — الراية التي تحسمها أول محاولة نداء، وغيابُ
         المجموع في الردّ لدالةٍ قديمة نجح نداؤها لسببٍ ما. */
  function paintVerify(c) {
    var ready = verifyOk && c.pending_synd !== undefined;
    vfiltersEl.hidden = !ready;
    if (!ready) { vfiltersEl.innerHTML = ''; return; }
    vfiltersEl.innerHTML =
      '<span style="align-self:center;font-size:12.5px;font-weight:700;' +
        'color:var(--text-secondary)">طابور التوثيق</span>' +
      VERIFY.map(function (d) {
        return '<button class="adm-chip" data-v="' + d[0] + '" aria-pressed="' +
          (state.verify === d[0]) + '">' + A.esc(d[1]) +
          '<span class="n">' + A.toAr(c[d[2]] || 0) + '</span></button>';
      }).join('');
    vfiltersEl.querySelectorAll('[data-v]').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-v');
        state.verify = (state.verify === v) ? '' : v;
        state.offset = 0; load();
      });
    });
  }

  function paintBranches(list) {
    var sel = $('branch');
    if (sel.options.length > 1) return;            /* يُبنى مرة واحدة */
    list.forEach(function (b) {
      var o = document.createElement('option');
      o.value = o.textContent = b;
      sel.appendChild(o);
    });
  }

  function paintRows() {
    if (!rows.length) {
      /* شريحة الطابور تصفيةٌ كسائرها: بدونها في الشرط كان طابورٌ فارغ
         يقول «لا حسابات مسجّلة بعد» على منصةٍ فيها آلاف الحسابات. */
      var filtered = !!(state.search || state.status !== 'all' ||
                        state.branch !== 'all' || state.verify);
      tbody.innerHTML = '<tr><td colspan="11">' + A.emptyState(
        filtered ? 'لا نتائج مطابقة' : 'لا حسابات مسجّلة بعد',
        filtered
          ? 'جرّب توسيع البحث أو إلغاء التصفية.'
          : 'ستظهر هنا طلبات الانتساب فور تسجيل المهندسين من التطبيق.'
      ) + '</td></tr>';
      $('selAll').checked = false;
      return;
    }

    tbody.innerHTML = rows.map(function (a) {
      var s = STATUS[a.status] || { label: a.status, cls: '' };
      var contact = a.contact_method === 'email' ? (a.email || '—') : (a.phone || '—');
      var sel = picked[a.id] ? ' data-sel="1"' : '';
      return '<tr' + sel + ' data-id="' + A.esc(a.id) + '">' +
        '<td><input class="adm-check" type="checkbox" data-pick="' + A.esc(a.id) + '"' +
          (picked[a.id] ? ' checked' : '') + ' aria-label="تحديد" data-write></td>' +
        /* معرّف الحساب (member_no) كما يراه العضو في «حسابي» حرفاً بحرف —
           أرقام لاتينية بلا تحويل، كي يطابق الموظف ما يُمليه العضو بالعين */
        '<td class="num strong" dir="ltr" style="text-align:start">' +
          (a.member_no ? '<span class="adm-mono">' + A.esc(a.member_no) + '</span>' : '—') + '</td>' +
        '<td class="wrap"><a class="link" href="admin-user-detail.html?id=' + A.esc(a.id) + '">' +
          A.esc(a.name) + '</a>' +
          (a.exempt ? '<span class="adm-sub"><span class="tag tag--gold">معفى من الرسوم</span></span>' : '') +
          (a.pass_hash === undefined && a.has_password === false
            ? '<span class="adm-sub">بلا كلمة مرور</span>' : '') + '</td>' +
        /* علامتا الطابور (ترحيلة ٠٢٩): admin_list_accounts تُعيد صف الحساب
           كاملاً (to_jsonb(f) ناقص pass_hash)، فالحقلان يصلان بلا تعديل
           خادمي — وقبل تطبيق الترحيلة يكونان undefined فلا تُرسم علامة
           ولا يتأثر الجدول بشيء. الموضع بجانب الرقم والفرع لا في عمود
           جديد: القرار يُتّخذ «وفقًا للرقم النقابي والفرع» فهناك تُقرأ. */
        '<td class="num strong">' + A.esc(a.synd_no) +
          (a.synd_no_status === 'pending'
            ? '<span class="adm-sub"><span class="tag tag--gold">قيد التحقق</span></span>' : '') + '</td>' +
        '<td class="num us-minor">' + A.esc(a.national_id) + '</td>' +
        '<td>' + A.esc(a.branch) +
          (a.grade_req_status === 'pending'
            ? '<span class="adm-sub"><span class="tag tag--gold">المرتبة قيد التحقق</span></span>' : '') + '</td>' +
        '<td>' + specCell(a.specialty) + '</td>' +
        '<td class="num us-contact" dir="ltr" style="text-align:start">' +
          A.esc(contact).replace('@', '@<wbr>') + '</td>' +
        '<td class="us-minor">' + A.arDate(a.created_at) + '</td>' +
        '<td><span class="tag ' + s.cls + '">' + A.esc(s.label) + '</span>' +
          (a.status === 'rejected' && a.note
            ? '<span class="adm-sub us-reason" title="' + A.esc(a.note) + '">السبب: ' + A.esc(a.note) + '</span>' : '') +
          (a.decided_at ? '<span class="adm-sub">' + A.arDate(a.decided_at) + '</span>' : '') + '</td>' +
        '<td class="acts">' + actions(a) + '</td>' +
      '</tr>';
    }).join('');

    $('selAll').checked = rows.length > 0 && rows.every(function (r) { return picked[r.id]; });
  }

  /* الاختصاص (٠٤١): «مدنية» بشارة خضراء لأنها وحدها تفتح امتحان تقييم
     الأضرار؛ والفراغ مكتوب صراحةً — الحساب بلا اختصاص محجوب عن الامتحان.
     undefined (قاعدة بلا ٠٤١) يُرسم شرطة لا «لم يُحدَّد» كي لا يكذب الجدول. */
  function specCell(code) {
    if (code === undefined) { return '—'; }
    if (!code) { return '<span class="adm-sub" style="margin:0">لم يُحدَّد</span>'; }
    var label = API.specialtyLabel ? API.specialtyLabel(code) : code;
    return code === 'civil'
      ? '<span class="tag tag--success">' + A.esc(label) + '</span>'
      : A.esc(label);
  }

  /* «غير مسجّل» قيمة حارسة لحسابات التسجيل السريع، لا رقمٌ يُوثَّق */
  function hasSyndNo(a) { return !!a.synd_no && a.synd_no !== 'غير مسجّل'; }

  function actions(a) {
    var b = [];
    if (a.synd_no_status === 'pending' && hasSyndNo(a) && API.admin.verifySyndNo) {
      b.push('<button class="btn btn-outline btn-sm" data-act="synd" data-write>مراجعة الرقم</button>');
    }
    if (a.status !== 'approved') {
      b.push('<button class="btn btn-primary btn-sm" data-act="approve" data-write>موافقة</button>');
    }
    if (a.status !== 'rejected') {
      b.push('<button class="btn btn-outline btn-sm" data-act="reject" data-write>رفض</button>');
    }
    if (a.status !== 'pending') {
      b.push('<button class="btn btn-outline btn-sm" data-act="reconsider" data-write>إعادة النظر</button>');
    }
    b.push('<button class="btn btn-outline btn-sm" data-act="edit" data-write>تعديل</button>');
    return '<span style="display:flex;gap:6px;flex-wrap:wrap">' + b.join('') + '</span>';
  }

  /* ---------------------------------------------------------------- الأحداث */
  function onRowChange(e) {
    var cb = e.target.closest('[data-pick]');
    if (!cb) return;
    var id = cb.getAttribute('data-pick');
    var row = rows.filter(function (r) { return r.id === id; })[0];
    if (cb.checked) { picked[id] = row; } else { delete picked[id]; }
    cb.closest('tr').setAttribute('data-sel', cb.checked ? '1' : '');
    $('selAll').checked = rows.every(function (r) { return picked[r.id]; });
    paintBulk();
  }

  function onRowClick(e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var tr = btn.closest('tr');
    var id = tr.getAttribute('data-id');
    var a = rows.filter(function (r) { return r.id === id; })[0];
    if (!a) return;
    var act = btn.getAttribute('data-act');

    if (act === 'edit') return openEdit(a);
    if (act === 'synd') return openSyndReview(a);
    if (act === 'approve')    return setStatus([id], 'approved', null, who(a));
    if (act === 'reconsider') return setStatus([id], 'pending', null, who(a));
    if (act === 'reject') {
      return A.confirm({
        title: 'رفض الطلب', danger: true, okLabel: 'رفض الطلب',
        text: 'سيُرفض طلب «' + who(a) + '». يظهر السبب للعضو داخل التطبيق.',
        reason: 'سبب الرفض (اختياري)'
      }).then(function (reason) {
        if (reason === null) return;
        setStatus([id], 'rejected', reason || null, who(a));
      });
    }
  }

  /* الاسم مع معرّف الحساب في رسائل القرار: التفعيل يجري بالمعرّف، فتأكيده
     في الرسالة يكشف فوراً أي خلطٍ بين حسابين متشابهَي الاسم */
  function who(a) {
    return (a.name || '—') + (a.member_no ? '» — معرّف الحساب «' + a.member_no : '');
  }

  function setStatus(ids, status, note, name) {
    return API.admin.bulkStatus(ids, status, note).then(function (n) {
      var word = status === 'approved' ? 'الموافقة على' : status === 'rejected' ? 'رفض' : 'إعادة';
      A.toast(ids.length === 1
        ? ('تمت ' + word + ' «' + name + '».')
        : ('تم تحديث ' + A.toAr(n) + ' حساباً.'), 'ok');
      picked = Object.create(null);
      paintBulk();
      load();
    }).catch(function (e) { A.toast(A.errText(e), 'bad'); });
  }

  function paintBulk() {
    var n = Object.keys(picked).length;
    bulkBar.hidden = n === 0;
    bulkCount.textContent = 'محدَّد: ' + A.toAr(n) + ' حساب';
  }

  function bulk(status) {
    var ids = Object.keys(picked);
    if (!ids.length) return;
    A.confirm({
      title: status === 'approved' ? 'موافقة جماعية' : 'رفض جماعي',
      danger: status === 'rejected',
      okLabel: status === 'approved' ? 'الموافقة على الكل' : 'رفض الكل',
      text: 'سيُطبَّق الإجراء على ' + A.toAr(ids.length) + ' حساباً محدَّداً.',
      reason: status === 'rejected' ? 'سبب الرفض (يُطبَّق على الكل)' : null
    }).then(function (r) {
      if (r === null) return;
      setStatus(ids, status, typeof r === 'string' ? r : null);
    });
  }

  /* ---------------------------------------------------------------- الرقم النقابي */
  var VSTATUS = {
    pending:  ['الرقم قيد التحقق', 'tag--gold'],
    verified: ['الرقم موثَّق',     'tag--success'],
    rejected: ['الرقم مرفوض',      'tag--error']
  };

  /* أرقام لاتينية بلا مسافات أو شرطات أو علامات اتجاه — القاعدة تطبّع ثانيةً */
  function syndNorm(v) {
    return A.toAr(String(v == null ? '' : v))
      .replace(/[\s ‎‏⁦-⁩]+/g, '')
      .replace(/[-–—ـ]+/g, '');
  }

  function errBox(msg) {
    return '<div class="notice notice--error">' + A.ICONS.bad + '<span>' + A.esc(msg) + '</span></div>';
  }

  function matchHtml(m) {
    var s = STATUS[m.status] || { label: m.status || '—', cls: '' };
    var v = VSTATUS[m.synd_no_status || ''];
    return '<li class="sc-item">' +
      '<div class="sc-main">' +
        '<a href="admin-user-detail.html?id=' + A.esc(m.account_id) + '">' + A.esc(m.name || '—') + '</a>' +
        '<span class="adm-sub">معرّف الحساب <span dir="ltr">' + A.esc(A.toAr(m.member_no || '—')) + '</span>' +
          (m.branch ? ' · فرع ' + A.esc(m.branch) : '') + '</span>' +
      '</div>' +
      '<div class="sc-tags">' +
        '<span class="tag ' + s.cls + '">' + A.esc(s.label) + '</span>' +
        (v ? '<span class="tag ' + v[1] + '">' + A.esc(v[0]) + '</span>' : '') +
      '</div>' +
    '</li>';
  }

  /* الحسابات التي تحمل الرقم عدا الحساب قيد المراجعة (selfId) */
  function others(r, selfId) {
    return ((r && r.matches) || []).filter(function (m) { return !selfId || m.account_id !== selfId; });
  }
  function verifiedOn(r, selfId) {
    return others(r, selfId).filter(function (m) { return m.synd_no_status === 'verified'; });
  }

  /* نتيجة admin_check_synd_no: الصيغة ثم الحسابات التي تحمل الرقم وتنبيه التكرار */
  function checkHtml(r, selfId) {
    var list = others(r, selfId);
    var html = '<div class="sc-head">' +
      (r.format_ok
        ? '<span class="tag tag--success">الصيغة سليمة</span>'
        : '<span class="tag tag--error">صيغة غير صحيحة</span>') +
      '<span class="adm-mono" dir="ltr">' + A.esc(A.toAr(r.normalized || '—')) + '</span>' +
    '</div>';
    if (selfId && verifiedOn(r, selfId).length) {
      html += errBox('الرقم موثَّق على حساب آخر. توثيقه هنا يحتاج تأكيداً صريحاً.');
    } else if (selfId && list.length) {
      html += '<div class="notice">' + A.ICONS.info + '<span>الرقم مستخدم أيضاً في ' +
        A.esc(A.count(list.length, 'حساب آخر', 'حسابين آخرين', 'حسابات أخرى', 'حساباً آخر')) + '.</span></div>';
    } else if (!selfId && list.length > 1) {
      html += errBox('الرقم مسجّل على ' +
        A.count(list.length, 'حساب واحد', 'حسابين', 'حسابات', 'حساباً') + '.');
    }
    html += list.length
      ? '<ul class="sc-list">' + list.map(matchHtml).join('') + '</ul>'
      : '<p class="adm-sub" style="margin:0">' +
          (selfId ? 'لا حساب آخر يحمل هذا الرقم.' : 'لا حساب على المنصة بهذا الرقم.') + '</p>';
    return html;
  }

  function checkFor(no, selfId) {
    return Promise.resolve().then(function () {
      if (!API.admin.checkSyndNo) {
        throw new Error('أداة فحص الرقم غير متاحة في نسخة اللوحة المحمّلة — حدّث الصفحة.');
      }
      return API.admin.checkSyndNo(no, selfId || null);
    });
  }

  /* أداة شريط الأدوات: رقمٌ يُكتب فتظهر الحسابات التي تحمله */
  function openSyndCheck() {
    var seq = 0, busy = false;
    var s = A.sheet({
      title: 'التحقق من رقم نقابي',
      okLabel: 'تحقق',
      closeLabel: 'إغلاق',
      body:
        '<form class="field" id="scForm" novalidate>' +
          '<label for="scNo">الرقم النقابي</label>' +
          '<input class="input" id="scNo" dir="ltr" inputmode="numeric" autocomplete="off" maxlength="24">' +
        '</form>' +
        '<div class="sc-out" id="scOut" aria-live="polite"></div>',
      onOk: function () { run(); }
    });
    var okBtn = s.el.querySelector('[data-ok]');
    var inp = s.el.querySelector('#scNo'), out = s.el.querySelector('#scOut');
    s.el.querySelector('#scForm').addEventListener('submit', function (e) {
      e.preventDefault();
      run();
    });

    function run() {
      if (busy) return;
      var no = syndNorm(inp.value);
      if (!no) { out.innerHTML = ''; inp.focus(); return; }
      var my = ++seq;
      busy = true;
      okBtn.disabled = true;
      out.innerHTML = '<p class="adm-sub" style="margin:0">جارٍ الفحص…</p>';
      checkFor(no, null).then(function (r) {
        if (my === seq) { out.innerHTML = checkHtml(r || {}, null); }
      }).catch(function (e) {
        if (my === seq) { out.innerHTML = errBox(A.errText(e)); }
      }).then(function () {
        busy = false;
        okBtn.disabled = false;
      });
    }
  }

  /* مراجعة رقمٍ بانتظار التوثيق من الجدول مباشرة: الفحص يسبق القرار */
  function openSyndReview(a) {
    var res = null;
    var s = A.sheet({
      title: 'مراجعة الرقم النقابي',
      okLabel: 'توثيق الرقم',
      body:
        '<dl class="adm-kv">' +
          '<dt>العضو</dt><dd>' + A.esc(a.name) + '</dd>' +
          '<dt>الرقم النقابي</dt><dd><span class="adm-mono" dir="ltr">' + A.esc(a.synd_no) + '</span></dd>' +
          '<dt>الفرع النقابي</dt><dd>' + A.esc(a.branch || '—') + '</dd>' +
        '</dl>' +
        '<div class="sc-out" id="scOut" aria-live="polite">' +
          '<p class="adm-sub" style="margin:0">جارٍ فحص الرقم…</p></div>' +
        '<div><button class="btn btn-outline btn-sm" type="button" id="scReject" data-write>رفض الرقم بسبب</button></div>',
      onOk: function (host, close) {
        if (verifiedOn(res, a.id).length) {
          close();
          askForceVerify(a, res);
          return;
        }
        return API.admin.verifySyndNo(a.id, true, null).then(function () {
          A.toast('وُثّق الرقم النقابي لـ«' + a.name + '».', 'ok');
          load();
        });
      }
    });
    var okBtn = s.el.querySelector('[data-ok]');
    var out = s.el.querySelector('#scOut');
    okBtn.disabled = true;
    s.el.querySelector('#scReject').addEventListener('click', function () {
      s.close();
      askSyndReject(a);
    });
    /* تعذّر الفحص لا يحجب القرار: يُعرض السبب ويبقى التوثيق متاحاً */
    checkFor(a.synd_no, a.id).then(function (r) {
      res = r || {};
      out.innerHTML = checkHtml(res, a.id);
    }).catch(function (e) {
      out.innerHTML = errBox('تعذّر فحص الرقم: ' + A.errText(e));
    }).then(function () {
      okBtn.disabled = false;
    });
  }

  function askForceVerify(a, r) {
    var v = verifiedOn(r, a.id);
    var first = v[0] || {};
    A.confirm({
      title: 'الرقم موثَّق على حساب آخر', danger: true, okLabel: 'توثيق رغم ذلك',
      text: 'الرقم ' + A.toAr(a.synd_no) + ' موثَّق على حساب «' + (first.name || '—') + '» (معرّف الحساب ' +
            A.toAr(first.member_no || '—') + ')' +
            (v.length > 1 ? ' و' + A.count(v.length - 1, 'حساب آخر', 'حسابين آخرين', 'حسابات أخرى', 'حساباً آخر') : '') +
            '. توثيقه لـ«' + a.name + '» يجعله موثَّقاً على أكثر من حساب، فتأكد من صاحب الرقم قبل المتابعة.',
      reason: 'سبب التوثيق رغم التكرار (يُسجَّل في سجل التدقيق)',
      reasonRequired: true
    }).then(function (note) {
      if (note === null) return;
      API.admin.verifySyndNo(a.id, true, note).then(function () {
        A.toast('وُثّق الرقم النقابي لـ«' + a.name + '».', 'ok');
        load();
      }).catch(function (e) { A.toast(A.errText(e), 'bad'); });
    });
  }

  function askSyndReject(a) {
    A.confirm({
      title: 'رفض الرقم النقابي', danger: true, okLabel: 'رفض الرقم',
      text: 'يعود الحقل قابلاً للتعديل عند العضو، ويُعرض له السبب داخل التطبيق.',
      reason: 'سبب الرفض (يظهر للعضو)', reasonRequired: true
    }).then(function (note) {
      if (note === null) return;
      API.admin.verifySyndNo(a.id, false, note).then(function () {
        A.toast('رُفض الرقم النقابي لـ«' + a.name + '».', 'ok');
        load();
      }).catch(function (e) { A.toast(A.errText(e), 'bad'); });
    });
  }

  /* ---------------------------------------------------------------- التعديل */
  function openEdit(a) {
    var branches = Array.prototype.slice.call($('branch').options)
      .filter(function (o) { return o.value !== 'all'; })
      .map(function (o) {
        return '<option value="' + A.esc(o.value) + '"' +
          (o.value === a.branch ? ' selected' : '') + '>' + A.esc(o.value) + '</option>';
      }).join('');

    A.sheet({
      title: 'تعديل بيانات الحساب',
      okLabel: 'حفظ التعديلات',
      body:
        '<div class="field"><label for="eName">الاسم الثلاثي</label>' +
          '<input class="input" id="eName" value="' + A.esc(a.name) + '" maxlength="120"></div>' +
        '<div class="field"><label for="eSynd">الرقم النقابي</label>' +
          '<input class="input" id="eSynd" dir="ltr" value="' + A.esc(a.synd_no) + '"></div>' +
        '<div class="field"><label for="eNid">رقم الهوية الوطنية</label>' +
          '<input class="input" id="eNid" dir="ltr" value="' + A.esc(a.national_id) + '"></div>' +
        '<div class="field"><label for="eBranch">الفرع النقابي</label>' +
          '<select class="input" id="eBranch">' + branches + '</select></div>' +
        specField(a) +
        '<div class="field"><label for="ePhone">رقم الموبايل</label>' +
          '<input class="input" id="ePhone" dir="ltr" value="' + A.esc(a.phone || '') + '"></div>' +
        '<div class="field"><label for="eEmail">البريد الإلكتروني</label>' +
          '<input class="input" id="eEmail" dir="ltr" value="' + A.esc(a.email || '') + '"></div>' +
        '<div class="field"><label style="display:flex;align-items:center;gap:9px;cursor:pointer">' +
          '<input class="adm-check" type="checkbox" id="eExempt"' + (a.exempt ? ' checked' : '') + '>' +
          'معفى من الرسوم</label>' +
          '<span class="adm-sub">الإعفاء يستثني الحساب من احتساب الإيرادات.</span></div>' +
        '<div class="field"><label for="eNote">ملاحظة إدارية</label>' +
          '<input class="input" id="eNote" value="' + A.esc(a.note || '') + '" maxlength="200"></div>' +
        '<div class="notice"><span>تغيير هذه الحقول يُسجَّل في سجل التدقيق باسمك.</span></div>',
      onOk: function (host) {
        var g = function (id) { return host.querySelector('#' + id).value.trim(); };
        return saveSpec(host, a).then(function () {
          return API.admin.updateAccount(a.id, {
            name: g('eName'), synd_no: g('eSynd'), national_id: g('eNid'),
            branch: host.querySelector('#eBranch').value,
            phone: g('ePhone'), email: g('eEmail'),
            exempt: host.querySelector('#eExempt').checked,
            note: g('eNote')
          });
        }).then(function () {
          A.toast('حُفظت تعديلات «' + g('eName') + '».', 'ok');
          load();
        });
      }
    });
  }

  /* حقل الاختصاص (٠٤١) في نافذة التعديل — يُحفظ بدالته المستقلة
     admin_set_account_specialty لأن admin_update_account لا تعرف العمود.
     لا يُرسم على قاعدة بلا ٠٤١ (specialty غائب من الصف كلياً). */
  function specField(a) {
    if (a.specialty === undefined || !API.SPECIALTIES) { return ''; }
    return '<div class="field"><label for="eSpec">الاختصاص الهندسي</label>' +
      '<select class="input" id="eSpec">' +
        '<option value=""' + (a.specialty ? '' : ' selected') + '>لم يُحدَّد</option>' +
        API.SPECIALTIES.map(function (s) {
          return '<option value="' + s[0] + '"' + (a.specialty === s[0] ? ' selected' : '') + '>' +
            A.esc(s[1]) + '</option>';
        }).join('') +
      '</select>' +
      '<span class="hint">امتحان تقييم الأضرار مفتوح للاختصاص المدني وحده. ' +
        'بعد تفعيل الحساب لا يغيّر العضو اختصاصه إلا من هنا.</span></div>';
  }
  function saveSpec(host, a) {
    var el = host.querySelector('#eSpec');
    if (!el || (el.value || null) === (a.specialty || null)) { return Promise.resolve(); }
    return API.admin.setSpecialty(a.id, el.value || null);
  }

  /* ---------------------------------------------------------------- التصدير */
  function exportAll() {
    var btn = $('exportBtn');
    btn.disabled = true; btn.textContent = 'جارٍ التجهيز…';
    /* التصدير يجلب كل السجل من الخادم لا الصفحة المعروضة فقط —
       وبالتصفية المعروضة نفسها: verify معها وإلا صدّر «تصدير Excel» فوق
       طابورٍ مفتوح كلَّ الحسابات، وهو غير ما يراه الموظف أمامه. ويمرّ
       بـfetchAccounts لا بالـAPI مباشرةً كي ينتفع بمسار التسامح نفسه. */
    fetchAccounts({ search: state.search, status: state.status, branch: state.branch,
                    verify: state.verify, sort: state.sort, limit: 500, offset: 0 })
      .then(function (d) {
        var all = d.rows || [];
        A.exportCsv('osea-accounts.csv',
          ['معرّف الحساب', 'الاسم', 'الرقم النقابي', 'رقم الهوية', 'الفرع', 'الاختصاص', 'وسيلة التواصل',
           'الموبايل', 'البريد', 'الحالة', 'معفى', 'تاريخ التسجيل', 'تاريخ القرار', 'ملاحظة'],
          all.map(function (a) {
            return [a.member_no || '', a.name, a.synd_no, a.national_id, a.branch,
                    a.specialty ? (API.specialtyLabel ? API.specialtyLabel(a.specialty) : a.specialty) : '',
                    a.contact_method === 'email' ? 'بريد' : 'موبايل',
                    a.phone || '', a.email || '',
                    (STATUS[a.status] || {}).label || a.status,
                    a.exempt ? 'نعم' : 'لا',
                    a.created_at || '', a.decided_at || '', a.note || ''];
          }));
        A.toast('صُدّر ' + A.toAr(all.length) + ' حساباً.' +
          (d.total > all.length ? ' (أول 500 من ' + A.toAr(d.total) + ')' : ''), 'ok');
      })
      .catch(function (e) { A.toast(A.errText(e), 'bad'); })
      .then(function () { btn.disabled = false; btn.textContent = 'تصدير Excel'; });
  }
})();
</script>
</body>
</html>
